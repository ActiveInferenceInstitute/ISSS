name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Tests with coverage gate
        run: pytest

# The suite is offline by construction: it serves its own fixture pages on
# 127.0.0.1, stubs every HTTP client, and replaces the OCR engine, so no job
# needs the system Tesseract binary, network access or any secret.

  # GNN baseline: .github/gnn-pin.json (v5.0.3, 8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1).
  # This repository ships no *.gnn.md, so the job validates the pinned upstream
  # exemplar: it proves the pin resolves and the pinned parser/syntax/type-check
  # stages run. It is a pinned baseline check, not a conformance claim about
  # repository content. The workflow has no link-check gate and this repository
  # makes no such claim, so none is recorded here.
  gnn-conformance:
    name: gnn baseline (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned GNN parser
        run: |
          python -m pip install --disable-pip-version-check defusedxml psutil pyyaml
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          pin = json.loads(Path(".github/gnn-pin.json").read_text(encoding="utf-8"))
          # Explicit checks, not `assert`: `python -O` strips asserts and would
          # otherwise skip the pin-triple assertion entirely.
          expected_pin = {
              "repository": "ActiveInferenceInstitute/Generalized_Notation_Notation",
              "tag": "v5.0.3",
              "revision": "8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1",
          }
          for key, value in expected_pin.items():
              if pin.get(key) != value:
                  raise SystemExit(f"gnn-pin.json {key!r} is {pin.get(key)!r}, expected {value!r}")
          spec = (
              "generalized-notation-notation @ "
              f"git+https://github.com/{pin['repository']}.git@{pin['revision']}"
          )
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "--no-deps", spec]
          )
          PY
      - name: Verify pinned parser on repository sketches or the pinned exemplar
        run: |
          python - <<'PY'
          import json
          import shutil
          import tempfile
          import urllib.request
          from pathlib import Path

          from gnn import __version__
          from gnn.parsers.basic import parse_gnn_formal, validate_gnn_syntax
          from gnn.type_checker import GNNTypeChecker

          pin = json.loads(Path(".github/gnn-pin.json").read_text(encoding="utf-8"))
          expected_version = pin["tag"].removeprefix("v")
          if __version__ != expected_version:
              raise SystemExit(f"installed GNN {__version__!r} does not match {pin['tag']!r}")

          sketches = sorted(Path(".").rglob("*.gnn.md"))
          if sketches:
              for sketch in sketches:
                  parsed = parse_gnn_formal(sketch)
                  if parsed is None or getattr(parsed, "parse_errors", None):
                      raise SystemExit(f"{sketch} did not parse cleanly")
                  valid, errors = validate_gnn_syntax(
                      sketch.read_text(encoding="utf-8"), is_content=True
                  )
                  if not valid:
                      raise SystemExit(f"{sketch} syntax errors: {errors!r}")
              with tempfile.TemporaryDirectory(prefix="repo-gnn-") as output_dir:
                  model_dir = Path(output_dir) / "models"
                  model_dir.mkdir()
                  for index, sketch in enumerate(sketches):
                      shutil.copy2(sketch, model_dir / f"{index:03d}_{sketch.name}")
                  type_check = GNNTypeChecker().validate_gnn_files(model_dir, Path(output_dir))
                  if type_check is not True:
                      raise SystemExit(
                          "GNN type checker did not pass the repository sketches "
                          f"(returned {type_check!r}; 2 means warnings or invalid files)"
                      )
              checked = len(sketches)
              source = "repository"
          else:
              exemplar_url = (
                  "https://raw.githubusercontent.com/ActiveInferenceInstitute/"
                  "Generalized_Notation_Notation/"
                  f"{pin['revision']}/input/gnn_files/basics/static_perception.md"
              )
              with tempfile.TemporaryDirectory(prefix="pinned-exemplar-") as output_dir:
                  exemplar = Path(output_dir) / "static_perception.md"
                  urllib.request.urlretrieve(exemplar_url, exemplar)
                  parsed = parse_gnn_formal(exemplar)
                  if parsed is None or getattr(parsed, "parse_errors", None):
                      raise SystemExit("pinned exemplar did not parse cleanly")
                  valid, errors = validate_gnn_syntax(
                      exemplar.read_text(encoding="utf-8"), is_content=True
                  )
                  if not valid:
                      raise SystemExit(f"pinned exemplar syntax errors: {errors!r}")
                  model_dir = Path(output_dir) / "models"
                  model_dir.mkdir()
                  shutil.copy2(exemplar, model_dir / exemplar.name)
                  type_check = GNNTypeChecker().validate_gnn_files(model_dir, Path(output_dir))
                  if type_check is not True:
                      raise SystemExit(
                          "GNN type checker did not pass the pinned exemplar "
                          f"(returned {type_check!r}; 2 means warnings or invalid files)"
                      )
              checked = 1
              source = "pinned-exemplar"

          print(
              json.dumps(
                  {
                      "gnn-version": __version__,
                      "pin-revision": pin["revision"],
                      "models": checked,
                      "source": source,
                      # Name what this run established: the pinned parser
                      # parsed and syntax/type-checked the files in `source`.
                      # It is not a conformance verdict for the repository when
                      # `source` is the pinned upstream exemplar.
                      "result": "content-pass" if source == "repository" else "baseline-pass",
                  },
                  sort_keys=True,
              )
          )
          PY
