name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One gate entry point. Every step below calls ./run.sh <arm>, the same
# commands that run locally, so the hosted gate and the local gate cannot
# drift. Lint runs once instead of once per Python version, the coverage gate
# runs on one version, and the other matrix legs run the coverage-free arm.

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ./run.sh lint

  test:
    name: test (${{ matrix.python-version }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Tests
        run: ./run.sh test
      - name: Tests with coverage gate
        if: matrix.python-version == '3.12'
        run: ./run.sh test-cov

# The suite is offline by construction: it serves its own fixture pages on
# 127.0.0.1, stubs every HTTP client, and replaces the OCR engine, so no job
# needs the system Tesseract binary, network access or any secret.

  docs:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Documentation links and generated pages
        run: ./run.sh docs

  # GNN pin: .github/gnn-pin.json (schema gnn-importer-pin/v1, v5.0.3,
  # 8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1). What the job parses is
  # recorded in .github/GNN.md; the check itself is scripts/gnn_conformance.py.
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Pinned GNN conformance
        run: ./run.sh gnn
